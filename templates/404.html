<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>404 - Page Not Found</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:linear-gradient(135deg,#ffd6e8,#fff);

}

.container{

text-align:center;

}

h1{

font-size:120px;

color:#d63384;

}

h2{

margin-bottom:20px;

}

p{

margin-bottom:30px;

color:#555;

}

a{

display:inline-block;

padding:15px 35px;

background:#d63384;

color:white;

text-decoration:none;

border-radius:30px;

transition:.3s;

}

a:hover{

background:#b0256b;

}

</style>

</head>

<body>

<div class="container">

<h1>404</h1>

<h2>Oops! Page Not Found</h2>

<p>

The page you are looking for doesn't exist.

</p>

<a href="/">

Back To Home

</a>

</div>

</body>

</html>
